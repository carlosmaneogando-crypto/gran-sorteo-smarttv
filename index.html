<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gran Sorteo Smart TV</title>

<style>

body{
font-family: Arial;
background: linear-gradient(180deg,#0d47a1,#1565c0);
color:white;
text-align:center;
margin:0;
padding:0;
}

header{
padding:20px;
font-size:28px;
font-weight:bold;
animation:fadeIn 2s ease;
}

.subtitulo{
font-size:18px;
margin-bottom:10px;
}

.aviso{
color:red;
font-weight:bold;
margin:10px;
}

.progreso-container{
width:90%;
margin:auto;
background:#eee;
border-radius:30px;
overflow:hidden;
}

.progreso{
height:30px;
background:linear-gradient(90deg,#00c6ff,#0072ff);
width:0%;
transition:1s;
}

#contador{
font-size:20px;
margin:15px;
}

input{
padding:12px;
width:80%;
border-radius:10px;
border:none;
margin:15px;
}

table{
width:95%;
margin:auto;
background:white;
color:black;
border-radius:12px;
overflow:hidden;
}

td{
padding:12px;
}

tr:nth-child(even){
background:#f5f5f5;
}

.top{
background:gold !important;
font-weight:bold;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

</style>

</head>

<body>

<header>

Gran sorteo: limpia tu aire y gana un Smart TV

</header>

<div class="subtitulo">

Válido en Santo Domingo Este

</div>

<div class="aviso">

Nota: El premio se desbloquea al llegar a 100 servicios realizados

</div>

<div id="contador">

Servicios realizados: 0 / 100

</div>

<div class="progreso-container">

<div class="progreso" id="barra"></div>

</div>

<input type="text" id="buscar" placeholder="Busca tu código (ej: AC023)">

<table id="tabla"></table>

<div id="countdown"></div>

fetch(url)
.then(res=>res.text())
.then(data=>{

let filas=data.split("\n").slice(1)

filas.sort((a,b)=>{

let A=a.split(",")[6]
let B=b.split(",")[6]

return B-A

})

let total=filas.length

document.getElementById("contador").innerText=

"Servicios realizados: "+total+" / 100"

document.getElementById("barra").style.width=

(total)+"%"

let col=fila.split(",")

let clase=i<3?"top":""

tabla+=

"<tr class='"+clase+"'><td>"+col[0]+"-"+col[1]+"</td><td>"+col[6]+" entradas</td></tr>"

})

document.getElementById("tabla").innerHTML=tabla

})

</script>

</body>

</html>
