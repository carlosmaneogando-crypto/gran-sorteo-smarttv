<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gran Sorteo Competitivo</title>

<style>

body{
 font-family: Arial, sans-serif;
 background:#0f172a;
 color:white;
 text-align:center;
 padding:20px;
}

.container{
 background:#1e293b;
 border-radius:20px;
 padding:30px;
 max-width:700px;
 margin:auto;
 box-shadow:0px 0px 20px rgba(0,0,0,0.5);
}

h1{
 font-size:38px;
 margin-bottom:10px;
}

h2{
 font-size:22px;
 margin-top:0;
}

.timer{
 font-size:26px;
 margin-top:20px;
}

.progress-box{
 margin-top:30px;
 font-size:22px;
}

.progress-bar{
 width:100%;
 background:#334155;
 height:30px;
 border-radius:15px;
 overflow:hidden;
 margin-top:10px;
}

.progress{
 height:100%;
 width:0%;
 background:#22c55e;
 transition:1s;
}

table{
 width:100%;
 margin-top:20px;
 border-collapse:collapse;
}

td{
 padding:12px;
 font-size:20px;
}

</style>

</head>
<body>

<div class="container">

<h1>🔥Gran Sorteo Competitivo🔥</h1>

<h2>Limpia Tu Aire Acondicionado y Gana un Smart TV 📺</h2>

<p>
Nota: el premio solo se desbloquea al cumplir la meta de 100 clientes antes del tiempo limite.
</p>

<div class="timer">
⌛Tiempo restante:
<span id="contador">cargando...</span>
</div>


<div class="progress-box">

📊 Progreso del Sorteo:

<table>

<tr>
<td>Servicios realizados</td>
<td>Faltantes</td>
<td>Estado</td>
</tr>

<tr>
<td id="realizados">--</td>
<td id="faltantes">--</td>
<td id="estado">--</td>
</tr>

</table>

<div class="progress-bar">
<div id="barra" class="progress"></div>
</div>

</div>

</div>


<script>

/* =============================
   CONTADOR REGRESIVO
============================= */

const fechaFinal = new Date();

fechaFinal.setMonth(fechaFinal.getMonth()+2);

function actualizarContador(){

 const ahora = new Date();

 const diferencia = fechaFinal - ahora;

 if(diferencia<=0){

  document.getElementById("contador").innerText="Tiempo terminado";

  return;

 }

 const dias = Math.floor(diferencia/(1000*60*60*24));

 const horas = Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));

 const minutos = Math.floor((diferencia%(1000*60*60))/(1000*60));

 const segundos = Math.floor((diferencia%(1000*60))/1000);

 document.getElementById("contador").innerText=
 dias+"d "+horas+"h "+minutos+"m "+segundos+"s";

}

setInterval(actualizarContador,1000);

actualizarContador();


/* =============================
   ESTADO DEL PREMIO (CSV)
============================= */

const estadoCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTaMGQvJBcyDYwQ0qBgrQXfttwcUjjUyoBCDN5qhEzUPczBQrAc36v7jNqv-gjnirNYYrvuI1ie3whW/pub?gid=1155813315&single=true&output=csv";


async function cargarEstadoPremio(){

 try{

  const res = await fetch(estadoCSV);

  if(!res.ok) return;

  let text = await res.text();

  text = text.replace(/^\uFEFF/,"");

  const filas = text.trim().split("\n");

  if(filas.length<2) return;

  const separador = filas[0].includes(";") ? ";" : ",";

  const datos = filas[1].split(separador);

  const realizados = Number(datos[0].replace(/\r/g,"").trim());

  const faltantes = Number(datos[1].replace(/\r/g,"").trim());

  const estado = datos[2].replace(/\r/g,"").trim();


  if(!isNaN(realizados)){

   document.getElementById("realizados").innerText=realizados;

   document.getElementById("faltantes").innerText=faltantes;

   document.getElementById("estado").innerText=estado;

   const porcentaje=(realizados/100)*100;

   document.getElementById("barra").style.width=porcentaje+"%";

  }

 }catch(error){

  console.log("Error leyendo CSV:",error);

 }

}

cargarEstadoPremio();

</script>

</body>
</html>
